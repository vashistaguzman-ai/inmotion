<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EDS Motion Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: dark;
    --ground:#06080c; --panel:#0d1219; --panel2:#121923; --raise:#18212d;
    --line:#1d2835; --line2:#2a3848;
    --text:#e4ebf3; --muted:#8395aa; --faint:#56667a;
    --cyan:#5ce1e6; --bound:#a9c6ff; --mag:#ff5fa2; --amber:#ffb547; --se:#6ee7a8; --auger:#d4f25c; --violet:#b69cff; --red:#ff6b6b;
    --f-disp:"Chakra Petch", "Segoe UI", system-ui, sans-serif;
    --f-sans:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --f-mono:"IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  html,body{background:var(--ground);color:var(--text)}
  body{font-family:var(--f-sans);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:18px 40px}
  .app{max-width:1440px;margin:0 auto}
  .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .disp{font-family:var(--f-disp)}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}

  /* header */
  .eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  h1.title{font-family:var(--f-disp);font-weight:600;font-size:clamp(22px,2.6vw,30px);line-height:1.1;letter-spacing:.01em;text-wrap:balance;margin:2px 0 0}
  .sig{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .sig i{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 8px currentColor}

  /* player */
  .player{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;position:relative}
  .player:fullscreen{border-radius:0;display:flex;flex-direction:column;justify-content:center;background:#000}
  .player:fullscreen .stage{width:min(100vw, calc((100vh - 120px) * 16 / 9));margin:0 auto}
  .stage{position:relative;aspect-ratio:16/9;width:100%;max-width:100%;background:#05070a;overflow:hidden;user-select:none}
  .stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
  .cap-wrap{position:absolute;left:0;right:0;bottom:4.5%;display:flex;justify-content:center;pointer-events:none;padding:0 5%}
  .cap{max-width:78ch;background:rgba(4,6,10,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(120,160,210,.14);border-radius:10px;padding:8px 14px;font-size:clamp(11px,1.45vw,17px);line-height:1.45;font-weight:500;text-align:center;animation:capIn .35s ease-out}
  .cap .w{color:rgba(228,235,243,.34);transition:color .12s}
  .cap .w.on{color:var(--text)}
  .cap .w.em.on{color:var(--cyan)}
  .cap .w.now{color:#fff;text-shadow:0 0 12px rgba(92,225,230,.55)}
  @keyframes capIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .title-card{position:absolute;left:4%;top:9%;pointer-events:none;animation:tcIn 2.8s ease-out forwards}
  .title-card .n{font-family:var(--f-mono);font-size:clamp(9px,1vw,12px);letter-spacing:.2em;color:var(--muted);text-transform:uppercase}
  .title-card .t{font-family:var(--f-disp);font-weight:600;font-size:clamp(16px,2.8vw,34px);line-height:1.05;text-shadow:0 2px 20px rgba(0,0,0,.8)}
  .title-card .bar{height:2px;width:64px;margin-top:8px;border-radius:2px}
  @keyframes tcIn{0%{opacity:0;transform:translateX(-12px)}12%{opacity:1;transform:none}78%{opacity:1}100%{opacity:0}}
  .poster{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 55%,rgba(6,8,12,.55),rgba(6,8,12,.92));}
  .poster-inner{text-align:center;padding:16px;max-width:560px}
  .bigplay{width:clamp(52px,7vw,76px);height:clamp(52px,7vw,76px);border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--cyan);color:#041014;box-shadow:0 0 0 8px rgba(92,225,230,.12),0 0 40px rgba(92,225,230,.35);transition:transform .15s}
  .bigplay:hover{transform:scale(1.06)}
  .tip{position:absolute;pointer-events:none;background:rgba(6,9,14,.94);border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;transform:translate(-50%,calc(-100% - 12px));z-index:5}
  .tip b{font-weight:600}
  .paused-badge{position:absolute;top:10px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;color:var(--amber);background:rgba(6,9,14,.8);border:1px solid rgba(255,181,71,.35);border-radius:999px;padding:3px 10px;pointer-events:none}

  /* info card */
  .info{position:absolute;right:12px;top:12px;width:min(330px,calc(100% - 24px));max-height:calc(100% - 24px);overflow:auto;background:rgba(9,13,19,.96);border:1px solid var(--line2);border-radius:12px;padding:14px 14px 12px;z-index:6;box-shadow:0 20px 50px rgba(0,0,0,.5);animation:capIn .25s ease-out}
  .info h3{font-family:var(--f-disp);font-weight:600;font-size:18px;line-height:1.15;margin:0}
  .info .body{color:#c3cfdc;font-size:13px;margin-top:8px}
  .info .formula{margin-top:10px;font-family:var(--f-mono);font-size:12.5px;background:#070a0f;border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--text);overflow-x:auto;white-space:nowrap}
  .info dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:10px 0 0;font-size:12.5px}
  .info dt{color:var(--muted)} .info dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}

  /* controls */
  .controls{padding:10px 14px 12px;border-top:1px solid var(--line);background:linear-gradient(#0e141c,#0b1017)}
  .ibtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border-radius:8px;color:#cfd9e4;transition:background .12s,color .12s;flex:none}
  .ibtn:hover{background:var(--raise);color:#fff}
  .ibtn.on{color:var(--cyan)}
  .ibtn:disabled{opacity:.35;cursor:not-allowed}
  .ibtn.play{width:40px;height:40px;background:var(--cyan);color:#041014;border-radius:50%}
  .ibtn.play:hover{background:#86ecef;color:#041014}
  .tl-wrap{position:relative;padding:9px 0;cursor:pointer;touch-action:none}
  .tl-track{position:relative;height:6px}
  .tl-seg{position:absolute;top:0;height:6px;border-radius:3px;background:#1b2531;overflow:hidden}
  .tl-fill{position:absolute;left:0;top:0;bottom:0}
  .tl-tick{position:absolute;top:1px;width:1px;height:4px;background:rgba(6,8,12,.7)}
  .tl-thumb{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:#fff;transform:translate(-50%,-50%);box-shadow:0 0 0 3px rgba(92,225,230,.35);pointer-events:none}
  .tl-tip{position:absolute;bottom:26px;transform:translateX(-50%);background:rgba(6,9,14,.96);border:1px solid var(--line2);border-radius:8px;padding:5px 9px;font-size:12px;white-space:nowrap;pointer-events:none;z-index:4}
  .chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:4px 9px;font-size:12px;color:#c9d4e0;transition:border-color .12s,background .12s;white-space:nowrap}
  .chip:hover{border-color:var(--line2);background:var(--raise)}
  .chip.on{border-color:currentColor}
  .chapter-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
  .menu{position:absolute;bottom:44px;right:0;background:#0b1017;border:1px solid var(--line2);border-radius:10px;padding:5px;z-index:10;min-width:110px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
  .menu button{display:flex;justify-content:space-between;width:100%;padding:5px 10px;border-radius:6px;font-family:var(--f-mono);font-size:12.5px}
  .menu button:hover{background:var(--raise)}
  .menu button.on{color:var(--cyan)}
  .wave{display:flex;align-items:center;gap:2px;height:22px}
  .wave i{display:block;width:3px;border-radius:2px;background:var(--cyan);opacity:.75;transition:height .08s}

  /* panels */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
  .card-h h2{font-family:var(--f-disp);font-weight:600;font-size:15px;letter-spacing:.02em;margin:0;display:flex;align-items:center;gap:8px}
  .script{position:relative;overflow-y:auto;scrollbar-width:thin}
  .ch-head{position:sticky;top:0;z-index:1;background:linear-gradient(var(--panel) 80%,rgba(13,18,25,0));padding:12px 14px 6px;display:flex;align-items:baseline;gap:8px}
  .ch-head .num{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
  .ch-head .nm{font-family:var(--f-disp);font-weight:600;font-size:14px}
  .ch-head .tm{margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--faint)}
  .sent{display:grid;grid-template-columns:44px 1fr;gap:8px;width:100%;text-align:left;padding:7px 14px;border-left:2px solid transparent;color:#aebccb;font-size:13.5px;line-height:1.5;position:relative;transition:background .12s,color .12s}
  .sent:hover{background:rgba(255,255,255,.025);color:var(--text)}
  .sent .ts{font-family:var(--f-mono);font-size:11px;color:var(--faint);padding-top:2px}
  .sent.active{background:rgba(92,225,230,.06);color:var(--text)}
  .sent.past{color:#7f90a3}
  .sent .prog{position:absolute;left:0;bottom:0;height:2px;background:currentColor;opacity:.5}
  .sent em{font-style:normal;color:var(--cyan)}
  .sent.past em{color:#7fb9bd}

  .lab-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;padding:14px}
  .ctl label, .ctl .lbl{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--muted);margin-bottom:6px}
  .ctl .val{font-family:var(--f-mono);color:var(--text);font-size:13px}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--acc,var(--cyan)) var(--p,50%),#243142 var(--p,50%));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid var(--acc,var(--cyan));cursor:pointer}
  input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--acc,var(--cyan));cursor:pointer}
  input[type=range]:focus-visible{outline:2px solid var(--cyan);outline-offset:4px}
  .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:10.5px;color:var(--faint);margin-top:4px}
  .elbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:8px;transition:border-color .12s,background .12s;padding:2px}
  .elbtn:hover{border-color:var(--line2);background:var(--raise)}
  .elbtn .z{font-family:var(--f-mono);font-size:9.5px;color:var(--faint);line-height:1}
  .elbtn .s{font-family:var(--f-disp);font-weight:600;font-size:17px;line-height:1.1}
  .elbtn.on{border-color:var(--cyan);background:rgba(92,225,230,.08)}
  .elbtn.on .s{color:var(--cyan)}
  select{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;color:var(--text);font:inherit;font-size:13px}
  .readout{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:12.5px}
  .readout dt{color:var(--muted)} .readout dd{margin:0;text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
  .edge{display:flex;align-items:center;gap:8px;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)}
  .edge:last-child{border-bottom:0}
  .dot{width:7px;height:7px;border-radius:50%;flex:none}
  .kbd{font-family:var(--f-mono);font-size:10.5px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:#b8c5d3}
  .toggle{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:#c9d4e0;cursor:pointer}
  .toggle input{accent-color:var(--cyan);width:15px;height:15px}
  @media (max-width: 700px){
    .info{position:static;width:auto;max-height:none;margin:8px;box-shadow:none}
    .cap{padding:5px 9px}
    .hide-sm{display:none!important}
  }
  @media (prefers-reduced-motion: reduce){
    .cap,.info,.title-card{animation:none}
    .title-card{opacity:1}
  }
</style>

</script>

const SCENES = [scene1, scene2, scene3, scene4, scene5, scene6];

function drawFrame(ctx, t, P, mouse) {

const ph_hud = P => `E₀ ${P.ph.E0.toFixed(1)} kV · ${P.ph.label}`;
function hitTest(hs, x, y) { let best = null, bd = 1e9; for (let i = hs.length - 1; i >= 0; i--) { const h = hs[i], d = Math.hypot(h.x - x, h.y - y), r = (h.r || 8) + 4; if (d <= r) { const score = d + r * 0.5; if (score < bd) { bd = score; best = h; } } } return best; }

/* =====================================================================
   7 · MICRO-CONCEPT CARDS
   ===================================================================== */
function infoFor(h, ph, spec, params) {
  const E0 = ph.E0, d = h.data || {};
  switch (h.kind) {
    case 'primary': return { color: C.cyan, title: 'Primary (beam) electron', body: `Accelerated through ${E0.toFixed(1)} kV in the gun. Its energy sets how deep the interaction volume reaches and which shells it can ionize: a shell is reachable only when the overvoltage U = E₀/E_c exceeds 1.${d.after ? ' This one has already given up at least the binding energy of the shell it ionized.' : ''}`, formula: 'λ = h / √(2m₀eV · (1 + eV / 2m₀c²))', stats: [['Energy E₀', `${E0.toFixed(1)} keV`], ['Speed v', `${ph.beta.toFixed(3)} c`], ['Wavelength λ', `${ph.lambda.toFixed(2)} pm`], ['Lorentz γ', ph.gamma.toFixed(4)]] };
    case 'volume': return { color: C.cyan, title: 'Interaction volume', body: 'The region where beam electrons scatter until they run out of energy, simulated here by Monte Carlo trajectories. It grows with E₀ and shrinks with Z: low-Z specimens give a teardrop, high-Z specimens a shallow hemisphere.', formula: 'R = 0.0276 · A · E₀^1.67 / (Z^0.89 · ρ)   [µm]', stats: [['Range R (K–O)', fmtLen(ph.R)], ['X-ray range Rₓ', fmtLen(ph.Rx)], ['Mean Z̄', ph.Zbar.toFixed(1)], ['Density ρ', `${ph.rho.toFixed(2)} g/cm³`]] };
    case 'se': return { color: C.se, title: 'Secondary electron (SE)', body: 'A loosely bound outer-shell electron knocked out by inelastic scattering. With under 50 eV it escapes only from the top few nanometers, which is why SE images show topographic contrast.', formula: 'E_SE < 50 eV  (most ≈ 2–5 eV)', stats: [['Escape depth', '≈ 5–50 nm'], ['Contrast', 'topography'], ['Scattering', 'inelastic']] };
    case 'bse': return { color: C.amber, title: 'Backscattered electron (BSE)', body: 'A beam electron turned back by elastic (Rutherford) scattering off a nucleus, keeping most of its energy. Heavier atoms scatter more strongly, so BSE images show Z-contrast: Ti appears brighter than Si.', formula: 'σ_R ∝ Z² / E²', stats: [['Backscatter η(Z̄)', ph.eta.toFixed(3)], ['Mean Z̄', ph.Zbar.toFixed(1)], ['Scattering', 'elastic'], ['Energy', `≲ ${E0.toFixed(1)} keV`]] };
    case 'xray': { const E = d.E; return { color: photonColor(E), title: 'X-ray photon', body: `Origin: ${d.src}. A characteristic photon carries exactly the energy gap between two shells, so its energy identifies the element that emitted it.`, formula: `λ = 1.2398 / E  →  ${(1.2398 / E).toFixed(4)} nm`, stats: [['Energy', fmtE(E)], ['Wavelength', `${(1239.8 / E).toFixed(1)} pm`], ['Frequency', `${(E * 2.418e17 / 1e18).toFixed(2)} × 10¹⁸ Hz`]] }; }
    case 'bound': { const el = d.el, Ec = el.levels[d.i][1], U = E0 / Ec; return { color: C.bound, title: `${SHELL[d.i]}-shell electron · ${el.name}`, body: `Bound with ${fmtE(Ec)}. ${U > 1 ? `At ${E0} kV the overvoltage is ${U.toFixed(2)}, so the beam can eject it.` : `At ${E0} kV the beam cannot reach it (U < 1); raise E₀ above ${fmtE(Ec)}.`}`, formula: 'U = E₀ / E_c   (ionization requires U > 1)', stats: [['Binding energy', fmtE(Ec)], ['Overvoltage U', U.toFixed(2)], ['Ionizable?', U > 1 ? 'yes' : 'no']] }; }
    case 'ejected': { const el = d.el, Ec = el.levels[d.i][1]; return { color: C.bound, title: `Ejected ${SHELL[d.i]} electron`, body: 'Knocked clean out of the atom. The primary paid at least its binding energy to free it; any extra energy leaves as the ejected electron’s kinetic energy.', formula: 'E_kin = ΔE − E_c', stats: [['Binding energy', fmtE(Ec)], ['Primary loses', `≥ ${fmtE(Ec)}`]] }; }
    case 'hole': { const el = d.el, w = omega(el.Z, d.i); return { color: C.red, title: `Core hole · ${SHELL[d.i]} shell`, body: 'A vacancy in an inner shell. It lives for roughly 10⁻¹⁵ s before an outer electron fills it. The released energy leaves either as a characteristic X-ray (probability ω) or as an Auger electron (1 − ω).', formula: 'ω_K ≈ Z⁴ / (Z⁴ + 1.12 × 10⁶)', stats: [['Fluorescence ω', w < 0.01 ? w.toFixed(4) : w.toFixed(3)], ['Auger 1 − ω', (1 - w).toFixed(3)], ['Element', `${el.sym} (Z = ${el.Z})`]] }; }
    case 'nucleus': { const el = d.el; return { color: '#ff9a5c', title: `Nucleus · ${el.name}`, body: 'Positive charge +Ze. Its Coulomb field deflects passing electrons: elastic deflection gives backscattered electrons (and HAADF contrast in STEM), and deceleration gives Bremsstrahlung.', formula: 'Rutherford: σ ∝ Z² / E²', stats: [['Atomic number Z', el.Z], ['Atomic mass A', el.A.toFixed(2)], ['Density ρ', `${el.rho} g/cm³`]] }; }

    case 'auger': return { color: C.auger, title: `Auger electron (${d.nm})`, body: 'Emitted when the relaxation energy is handed to another outer electron instead of leaving as a photon. Its energy is characteristic, but it escapes only from the top few nanometers, so Auger spectroscopy is a surface technique.', formula: 'E_KLL ≈ E_K − E_L − E_L′', stats: [['Energy', fmtE(d.E)], ['Escape depth', '≈ 0.5–3 nm']] };
    case 'brems': return { color: C.amber, title: d.dh ? 'Duane–Hunt limit' : 'Bremsstrahlung (continuum)', body: d.dh ? 'An electron can radiate at most all of its kinetic energy in one event, so the continuum ends exactly at E₀. Reading this cut-off checks the true accelerating voltage.' : 'Braking radiation from electrons decelerated in the nuclear field. Any energy from 0 to E₀ is possible, giving the smooth background under every EDS spectrum.', formula: 'Kramers: I(E) ∝ Z · (E₀ − E) / E', stats: [['Photon energy', fmtE(d.E)], ['Fraction of E₀', `${((d.E / E0) * 100).toFixed(0)} %`], ['Mean Z̄', ph.Zbar.toFixed(1)]] };
    case 'detector': { const l = spec.lines[0]; return { color: C.violet, title: 'Silicon drift detector (EDS)', body: 'Each X-ray makes electron–hole pairs in silicon (≈ 3.8 eV per pair). The collected charge is proportional to photon energy, so every pulse is sorted into an energy channel. Statistics broaden each line into a Gaussian peak.', formula: 'FWHM(E)² = FWHM_Mn² + 2.49 eV · (E − 5895 eV)', stats: [['Resolution @ Mn Kα', `${params.res} eV`], ...(l ? [[`FWHM @ ${l.sym} ${l.n}`, `${Math.round(l.fw * 1000)} eV`]] : []), ['e–h pairs for 8 keV', '≈ 2100']] }; }
    case 'peak': { const l = d.line; return { color: photonColor(l.E), title: `${l.sym} ${l.n} peak`, body: `Produced when a ${SHELL[l.sh]}-shell vacancy is filled from the ${SHELL[l.from]} shell. Its position identifies ${l.el.name}; its area (after ZAF correction) measures how much is present.`, formula: `E(${l.n}) = E_${SHELL[l.sh]} − E_${SHELL[l.from]}`, stats: [['Line energy', fmtE(l.E)], [`${SHELL[l.sh]} edge`, fmtE(l.edge)], ['Overvoltage U', l.U.toFixed(2)], ['FWHM', `${Math.round(l.fw * 1000)} eV`], ['Relative weight', l.rel.toFixed(2)]] }; }
    case 'edge': return { color: C.se, title: `${d.el.sym} ${SHELL[d.sh]} absorption edge`, body: 'The minimum energy needed to create a vacancy in this shell. Its lines appear only once E₀ passes the edge, and for efficient excitation you want U ≈ 2 or more.', formula: 'U = E₀ / E_c', stats: [['Edge energy', fmtE(d.Ec)], ['Overvoltage U', d.U.toFixed(2)]] };
    case 'eels': return { color: C.red, title: `EELS ${d.sh} ionization edge`, body: 'In the TEM an electron spectrometer measures how much energy each transmitted electron lost. Ionizing a shell costs at least its binding energy, so an edge appears at that loss. EELS works best for light elements and can reach ppm sensitivity.', formula: 'E_loss ≥ E_c', stats: [['Edge onset', fmtE(d.Ek)]] };
    default: return { color: C.text, title: 'Concept', body: '', stats: [] };
  }
}

function Icon({ name, size = 18, className = '', sw = 2 }) {
  const L = window.lucide; let node = L && L.icons && L.icons[name];
  if (!node) return <span aria-hidden="true" style={{ width: size, height: size, display: 'inline-block' }} />;
  const kids = node[0] === 'svg' ? node[2] || [] : node;
  const camel = o => { const r = {}; Object.keys(o || {}).forEach(k => { r[k.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = o[k]; }); return r; };
  return (<svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className} aria-hidden="true">
    {kids.map((k, i) => React.createElement(k[0], { key: i, ...camel(k[1]) }))}
  </svg>);
}

function Caption({ sent, sp }) {
  const toks = useMemo(() => { const out = []; let em = false; sent.text.split(' ').forEach(w => { let e = em; if (w.startsWith('*')) { e = true; em = true; } const clean = w.replace(/\*/g, ''); if (w.replace(/[.,:;!?)]+$/, '').endsWith('*')) em = false; out.push({ w: clean, em: e }); }); return out; }, [sent]);
  const total = toks.reduce((s, t) => s + t.w.length + 1, 0); let acc = 0; const pos = sp * total * 1.08;
  return (<div className="cap" key={sent.gi}>{toks.map((t, i) => { const st = acc; acc += t.w.length + 1; const on = pos >= st, now = on && pos < acc; return <span key={i} className={`w${t.em ? ' em' : ''}${on ? ' on' : ''}${now ? ' now' : ''}`}>{t.w}{' '}</span>; })}</div>);
}

function Stage({ t, P, tags, onHot, children }) {

    {children}
  </div>);
}

function InfoCard({ h, P, onClose }) {

  return (<div className="info" role="dialog" aria-label={I.title}>

function Timeline({ t, onSeek }) {
  const track = useRef(null), drag = useRef(false); const [hov, setHov] = useState(null);
  const posT = e => { const r = track.current.getBoundingClientRect(); return clamp((e.clientX - r.left) / r.width) * TOTAL; };
  const pct = x => `${(x / TOTAL) * 100}%`;
  const hl = hov != null ? locate(hov) : null;
  return (<div className="tl-wrap" role="slider" tabIndex={0} aria-label="Seek video" aria-valuemin={0} aria-valuemax={Math.round(TOTAL)} aria-valuenow={Math.round(t)} aria-valuetext={fmtTime(t)}
    onKeyDown={e => { if (e.key === 'ArrowRight') { e.preventDefault(); e.stopPropagation(); onSeek(t + 5); } if (e.key === 'ArrowLeft') { e.preventDefault(); e.stopPropagation(); onSeek(t - 5); } }}
    onPointerDown={e => { drag.current = true; try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {} onSeek(posT(e)); }}
    onPointerMove={e => { const v = posT(e); setHov(v); if (drag.current) onSeek(v); }}
    onPointerUp={() => { drag.current = false; }} onPointerCancel={() => { drag.current = false; }} onPointerLeave={() => { if (!drag.current) setHov(null); }}>
    <div ref={track} className="tl-track">
      {CHAPTERS.map((c, i) => { const w = c.dur, fill = clamp((t - c.start) / w); return (<div key={i} className="tl-seg" style={{ left: `calc(${pct(c.start)} + ${i ? 2 : 0}px)`, width: `calc(${pct(w)} - ${i ? 2 : 0}px)` }}><div className="tl-fill" style={{ width: `${fill * 100}%`, background: c.color }} /></div>); })}
      {SENTS.filter(s => s.si > 0).map(s => <div key={s.gi} className="tl-tick" style={{ left: pct(s.start) }} />)}
      <div className="tl-thumb" style={{ left: pct(t) }} />
    </div>
    {hl && <div className="tl-tip" style={{ left: pct(hov) }}><span className="mono" style={{ color: CHAPTERS[hl.ci].color }}>{fmtTime(hov)}</span> · {CHAPTERS[hl.ci].short}<div style={{ color: 'var(--muted)', maxWidth: 260, whiteSpace: 'normal', fontSize: 11.5 }}>{plain(SENTS[hl.gi].text).slice(0, 70)}…</div></div>}
  </div>);
}

function Waveform({ active, t }) {
  const bars = 22;
  return (<div className="wave hide-sm" aria-hidden="true">{Array.from({ length: bars }, (_, i) => { const h = active ? 4 + 16 * Math.abs(Math.sin(t * (5 + (i % 5)) + i * 1.7)) * (0.4 + 0.6 * hash(i + Math.floor(t * 6))) : 3; return <i key={i} style={{ height: h }} />; })}</div>);
}

}

function Slider({ id, label, value, min, max, step, onChange, fmt, ticks, acc }) {
  const p = ((value - min) / (max - min)) * 100;
  return (<div className="ctl"><label htmlFor={id}><span>{label}</span><span className="val">{fmt ? fmt(value) : value}</span></label>
    <input id={id} type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(parseFloat(e.target.value))} style={{ '--p': `${p}%`, '--acc': acc || 'var(--cyan)' }} />

function LabPanel({ params, set, ph, spec, onReset }) {
  const upd = (k, v) => set(p => ({ ...p, [k]: v }));
  const W = 320, H = 96;
  const path = useMemo(() => { let d = `M0 ${H}`; const mx = spec.max * 1.12; for (let i = 0; i < spec.n; i++) { const x = (i / spec.n) * W, y = H - (spec.mu[i] / mx) * (H - 6); d += ` L${x.toFixed(1)} ${y.toFixed(1)}`; } return d + ` L${W} ${H} Z`; }, [spec]);
  const edges = []; ph.comp.forEach(c => c.el.levels.forEach(([nm, Ec], sh) => { if (c.el.lines.some(l => l.sh === sh)) edges.push({ el: c.el, nm, Ec, U: ph.E0 / Ec }); }));

    <div className="card-h"><h2><Icon name="FlaskConical" size={16} /> Lab mode <span className="eyebrow" style={{ fontSize: 10 }}>changes apply to every frame, live</span></h2>

    </div>

        <dl className="readout">
          <dt>Electron speed</dt><dd>{ph.beta.toFixed(3)} c</dd>
          <dt>Wavelength λ</dt><dd>{ph.lambda.toFixed(2)} pm</dd>
          <dt>Interaction range R</dt><dd>{fmtLen(ph.R)}</dd>
          <dt>X-ray range Rₓ</dt><dd>{fmtLen(ph.Rx)}</dd>
          <dt>Backscatter η</dt><dd>{ph.eta.toFixed(3)}</dd>
        </dl>
      </div>
      <div className="flex flex-col gap-3">
        <div className="ctl"><span className="lbl"><span>Specimen element</span><span className="val">{ph.el.name}</span></span>
          <div className="grid gap-1.5" style={{ gridTemplateColumns: 'repeat(8, minmax(0,1fr))' }}>
            {EL_ORDER.map(s => <button key={s} className={`elbtn${params.el === s ? ' on' : ''}`} onClick={() => set(p => ({ ...p, el: s, el2: p.el2 === s ? 'none' : p.el2 }))} aria-pressed={params.el === s} aria-label={`${ELEMENTS[s].name}, Z ${ELEMENTS[s].Z}`}><span className="z">{ELEMENTS[s].Z}</span><span className="s">{s}</span></button>)}
          </div></div>
        <div className="grid grid-cols-2 gap-3">
          <div className="ctl"><label htmlFor="el2"><span>Second element</span></label>
            <select id="el2" value={params.el2} onChange={e => upd('el2', e.target.value)}><option value="none">None</option>{EL_ORDER.filter(s => s !== params.el).map(s => <option key={s} value={s}>{ELEMENTS[s].name} ({s})</option>)}</select></div>
          <div style={{ opacity: params.el2 === 'none' ? 0.4 : 1 }}><Slider id="x2" label="Amount" value={params.x2} min={5} max={60} step={1} onChange={v => upd('x2', v)} fmt={v => `${v} at%`} acc="var(--violet)" /></div>
        </div>
        <div>
          <div className="eyebrow" style={{ fontSize: 10, marginBottom: 4 }}>Absorption edges vs E₀</div>
          {edges.map((e, i) => { const on = e.U > 1; return (<div key={i} className="edge"><span className="dot" style={{ background: on ? 'var(--se)' : 'var(--amber)' }} /><span className="disp" style={{ fontWeight: 600, width: 54 }}>{e.el.sym} {e.nm}</span><span className="mono" style={{ color: 'var(--muted)' }}>{fmtE(e.Ec)}</span><span className="mono" style={{ marginLeft: 'auto', color: on ? 'var(--se)' : 'var(--amber)' }}>{on ? `U ${e.U.toFixed(2)} · lines on` : 'U < 1 · off'}</span></div>); })}
        </div>
      </div>
      <div className="flex flex-col gap-4">
        <Slider id="res" label="Detector resolution (FWHM @ Mn Kα)" value={params.res} min={60} max={220} step={5} onChange={v => upd('res', v)} fmt={v => `${v} eV`} ticks={['60', 'SDD 125', 'Si(Li) 150', '220 eV']} acc="var(--mag)" />
        <Slider id="cur" label="Probe current (count rate)" value={params.current} min={0.25} max={3} step={0.25} onChange={v => upd('current', v)} fmt={v => `${v.toFixed(2)} nA`} acc="var(--amber)" />
        <div>
          <div className="flex items-center justify-between"><span className="eyebrow" style={{ fontSize: 10 }}>Live spectrum preview · 0–{ph.E0} keV</span><label className="toggle"><input id="logy" type="checkbox" checked={params.logY} onChange={e => upd('logY', e.target.checked)} /> Log counts</label></div>
          <svg viewBox={`0 0 ${W} ${H + 14}`} width="100%" style={{ display: 'block', marginTop: 6 }} role="img" aria-label="Expected EDS spectrum for current settings">

            <text x="0" y={H + 11} fill="#56667a" fontSize="8" fontFamily="IBM Plex Mono, monospace">0</text>
            <text x={W} y={H + 11} fill="#56667a" fontSize="8" fontFamily="IBM Plex Mono, monospace" textAnchor="end">{ph.E0} keV</text>
          </svg>
        </div>
      </div>
    </div>
  </section>);
}

const DEFAULTS = { E0: 20, el: 'Cu', el2: 'none', x2: 20, res: 130, current: 1, logY: false };
const SPEEDS = [0.5, 0.75, 1, 1.25, 1.5, 2];

function App() {
  const [t, setT] = useState(0); const tRef = useRef(0);
  const [playing, setPlaying] = useState(false); const [started, setStarted] = useState(false);
  const [speed, setSpeed] = useState(() => { const s = store.get('speed', 1); return SPEEDS.includes(s) ? s : 1; }); const speedRef = useRef(speed); speedRef.current = speed;
  const [cc, setCc] = useState(() => store.get('cc', true)); const [tags, setTags] = useState(() => store.get('tags', true));
  const [tts, setTts] = useState(false); const ttsOK = typeof window !== 'undefined' && 'speechSynthesis' in window && typeof window.SpeechSynthesisUtterance === 'function';
  const [params, setParams] = useState(DEFAULTS); const [info, setInfo] = useState(null); const autoPaused = useRef(false);
  const [follow, setFollow] = useState(true); const [speedMenu, setSpeedMenu] = useState(false); const [fs, setFs] = useState(false);
  const playerRef = useRef(null);
  const ph = useMemo(() => physics(params), [params]);
  const spec = useMemo(() => buildSpectrum(ph, params.res, params.current), [ph, params.res, params.current]);
  const P = useMemo(() => ({ ph, spec, params }), [ph, spec, params]);
  const loc = locate(t), ended = t >= TOTAL - 0.001;

  useEffect(() => store.set('speed', speed), [speed]); useEffect(() => store.set('cc', cc), [cc]); useEffect(() => store.set('tags', tags), [tags]);
  const seek = useCallback(nt => { const v = clamp(nt, 0, TOTAL); tRef.current = v; setT(v); if (v > 0) setStarted(true); }, []);
  const play = useCallback(() => { if (tRef.current >= TOTAL - 0.01) seek(0); setStarted(true); setInfo(null); autoPaused.current = false; setPlaying(true); }, [seek]);
  const pause = useCallback(() => setPlaying(false), []);
  const toggleRef = useRef(); toggleRef.current = () => (playing ? pause() : play());
  const jumpCh = d => { const ci = clamp(loc.ci + d, 0, CHAPTERS.length - 1); const back = d < 0 && loc.lt > 2 ? loc.ci : ci; seek(CHAPTERS[back].start + 0.01); };
  const jumpRef = useRef(); jumpRef.current = jumpCh;

  useEffect(() => { if (!playing) return; let raf, last = performance.now();
    const loop = now => { const dt = Math.min(0.1, (now - last) / 1000); last = now; let n = tRef.current + dt * speedRef.current; if (n >= TOTAL) { tRef.current = TOTAL; setT(TOTAL); setPlaying(false); return; } tRef.current = n; setT(n); raf = requestAnimationFrame(loop); };
    raf = requestAnimationFrame(loop); return () => cancelAnimationFrame(raf); }, [playing]);

  // simulated narration track → optional real speech synthesis, one utterance per sentence
  useEffect(() => { if (!ttsOK) return; try { window.speechSynthesis.cancel(); if (!tts || !playing) return; const u = new SpeechSynthesisUtterance(plain(SENTS[loc.gi].text)); u.rate = clamp(speed * 1.05, 0.5, 2); window.speechSynthesis.speak(u); } catch (e) {} }, [loc.gi, tts, playing]);
  useEffect(() => () => { try { ttsOK && window.speechSynthesis.cancel(); } catch (e) {} }, []);

  useEffect(() => { const onKey = e => { const tg = e.target, tag = tg && tg.tagName;
      if (tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA' || (tg && tg.isContentEditable)) return;
      if (e.code === 'Space' || e.key === 'k') { e.preventDefault(); toggleRef.current(); }
      else if (e.key === 'ArrowRight') { e.preventDefault(); seek(tRef.current + 5); } else if (e.key === 'ArrowLeft') { e.preventDefault(); seek(tRef.current - 5); }
      else if (e.key === 'c' || e.key === 'C') setCc(v => !v); else if (e.key === 'g' || e.key === 'G') setTags(v => !v);
      else if (e.key === 'n' || e.key === 'N') jumpRef.current(1); else if (e.key === 'p' || e.key === 'P') jumpRef.current(-1);
      else if (e.key === 'Escape') { setInfo(null); setSpeedMenu(false); } };
    window.addEventListener('keydown', onKey); return () => window.removeEventListener('keydown', onKey); }, [seek]);
  useEffect(() => { const f = () => setFs(!!document.fullscreenElement); document.addEventListener('fullscreenchange', f); return () => document.removeEventListener('fullscreenchange', f); }, []);
  useEffect(() => { if (!speedMenu) return; const close = e => { if (!e.target.closest || !e.target.closest('.speed-wrap')) setSpeedMenu(false); }; document.addEventListener('pointerdown', close); return () => document.removeEventListener('pointerdown', close); }, [speedMenu]);

  const onHot = h => { if (playing) { autoPaused.current = true; setPlaying(false); } else autoPaused.current = false; setInfo(h); };
  const closeInfo = () => { setInfo(null); if (autoPaused.current) { autoPaused.current = false; setPlaying(true); } };
  const toggleFs = async () => { try { if (document.fullscreenElement) await document.exitFullscreen(); else await playerRef.current.requestFullscreen(); } catch (e) {} };
  const ch = CHAPTERS[loc.ci];

  return (<div className="app">
    <header className="flex flex-wrap items-end justify-between gap-3" style={{ marginBottom: 14 }}>
      <div><p className="eyebrow">MET_ENG 5520 · Electron Microscopy · Interactive lecture</p><h1 className="title">EDS Motion Lab: how an X-ray spectrum is born</h1></div>
      <div className="flex flex-wrap gap-3" aria-label="Signal color key">
        {[['Primary e⁻', C.cyan], ['Bound e⁻', C.bound], ['Secondary e⁻', C.se], ['Backscattered e⁻', C.amber], ['Auger e⁻', C.auger], ['X-ray photon', C.mag]].map(([n, c]) => <span key={n} className="sig" style={{ color: c }}><i style={{ background: c }} /><span style={{ color: 'var(--muted)' }}>{n}</span></span>)}
      </div>
    </header>

    <div className="grid gap-4" style={{ gridTemplateColumns: 'minmax(0,1fr)' }}>
      <div className="grid gap-4 lg:grid-cols-[minmax(0,1fr)_360px] items-start">
        <div className="flex flex-col gap-4" style={{ minWidth: 0 }}>
          <div ref={playerRef} className="player">
            <Stage t={t} P={P} tags={tags} onHot={onHot}>
              {started && loc.lt < 2.9 && <div className="title-card" key={loc.ci}><div className="n">Chapter {loc.ci + 1} / {CHAPTERS.length}</div><div className="t">{ch.title}</div><div className="bar" style={{ background: ch.color }} /></div>}
              {cc && started && <div className="cap-wrap"><Caption sent={SENTS[loc.gi]} sp={loc.sp} /></div>}
              {started && !playing && !ended && !info && <div className="paused-badge">PAUSED · click anything that moves</div>}
              {!started && <div className="poster"><div className="poster-inner">
                <p className="eyebrow">6 chapters · {fmtTime(TOTAL)} · narrated</p>
                <h2 className="disp" style={{ fontSize: 'clamp(20px,3.2vw,38px)', fontWeight: 600, lineHeight: 1.08, margin: '6px 0 14px', textWrap: 'balance' }}>From a single beam electron to a full EDS spectrum</h2>
                <button className="bigplay" onClick={play} aria-label="Play video"><Icon name="Play" size={30} sw={2.4} /></button>
                <p style={{ color: 'var(--muted)', marginTop: 14, fontSize: 'clamp(11px,1.2vw,13.5px)' }}>Click any moving particle to pause and read its physics. Change beam energy or element any time in Lab mode below.</p>
              </div></div>}
              {ended && <div className="poster"><div className="poster-inner"><p className="eyebrow">End of walkthrough</p><h2 className="disp" style={{ fontSize: 'clamp(18px,2.6vw,30px)', fontWeight: 600, margin: '6px 0 14px' }}>Try another element, then replay</h2>
                <button className="bigplay" onClick={play} aria-label="Replay"><Icon name="RotateCcw" size={28} sw={2.4} /></button>
                <div className="flex flex-wrap justify-center gap-2" style={{ marginTop: 14 }}>{CHAPTERS.map((c, i) => <button key={i} className="chip" style={{ color: c.color }} onClick={() => { seek(c.start + 0.01); setPlaying(true); }}>{i + 1} · {c.short}</button>)}</div></div></div>}
            </Stage>
            {info && <InfoCard h={info} P={P} onClose={closeInfo} />}
            <div className="controls">
              <Timeline t={t} onSeek={seek} />
              <div className="flex items-center gap-1.5 flex-wrap" style={{ marginTop: 4 }}>
                <button className="ibtn play" onClick={() => toggleRef.current()} aria-label={playing ? 'Pause' : 'Play'}><Icon name={playing ? 'Pause' : 'Play'} size={18} sw={2.4} /></button>
                <button className="ibtn" onClick={() => jumpCh(-1)} aria-label="Previous chapter" title="Previous chapter (P)"><Icon name="SkipBack" size={17} /></button>
                <button className="ibtn" onClick={() => seek(t - 5)} aria-label="Back 5 seconds" title="Back 5 s (←)"><Icon name="RotateCcw" size={16} /></button>
                <button className="ibtn" onClick={() => seek(t + 5)} aria-label="Forward 5 seconds" title="Forward 5 s (→)"><Icon name="RotateCw" size={16} /></button>
                <button className="ibtn" onClick={() => jumpCh(1)} disabled={loc.ci === CHAPTERS.length - 1} aria-label="Next chapter" title="Next chapter (N)"><Icon name="SkipForward" size={17} /></button>
                <span className="mono" style={{ fontSize: 12.5, color: 'var(--muted)', marginLeft: 6 }}><span style={{ color: 'var(--text)' }}>{fmtTime(t)}</span> / {fmtTime(TOTAL)}</span>
                <span className="hide-sm" style={{ marginLeft: 10, fontSize: 12.5, color: ch.color, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', maxWidth: 240 }}>{loc.ci + 1} · {ch.title}</span>
                <div style={{ marginLeft: 'auto' }} className="flex items-center gap-1.5">
                  <Waveform active={playing && started} t={t} />
                  {ttsOK && <button className={`ibtn${tts ? ' on' : ''}`} onClick={() => setTts(v => !v)} aria-pressed={tts} aria-label="Spoken narration" title="Spoken narration (browser text-to-speech)"><Icon name={tts ? 'Volume2' : 'VolumeX'} size={17} /></button>}
                  <button className={`ibtn${cc ? ' on' : ''}`} onClick={() => setCc(v => !v)} aria-pressed={cc} aria-label="Closed captions" title="Captions (C)"><Icon name="Captions" size={18} /></button>
                  <button className={`ibtn${tags ? ' on' : ''}`} onClick={() => setTags(v => !v)} aria-pressed={tags} aria-label="Concept tags overlay" title="Concept tags (G)"><Icon name="Tag" size={16} /></button>
                  <div className="relative speed-wrap">
                    <button className="ibtn mono" style={{ width: 'auto', padding: '0 8px', fontSize: 12.5 }} onClick={() => setSpeedMenu(v => !v)} aria-haspopup="menu" aria-expanded={speedMenu} aria-label={`Playback speed ${speed}x`}><Icon name="Gauge" size={15} /> <span style={{ marginLeft: 4 }}>{speed}×</span></button>
                    {speedMenu && <div className="menu" role="menu">{SPEEDS.map(s => <button key={s} role="menuitemradio" aria-checked={s === speed} className={s === speed ? 'on' : ''} onClick={() => { setSpeed(s); setSpeedMenu(false); }}><span>{s}×</span>{s === 1 && <span style={{ color: 'var(--faint)' }}>normal</span>}</button>)}</div>}
                  </div>
                  <button className="ibtn" onClick={toggleFs} aria-label={fs ? 'Exit full screen' : 'Full screen'}><Icon name={fs ? 'Minimize' : 'Maximize'} size={16} /></button>
                </div>
              </div>
              <div className="chapter-row" style={{ marginTop: 8 }}>
                {CHAPTERS.map((c, i) => <button key={i} className={`chip${loc.ci === i ? ' on' : ''}`} style={{ color: loc.ci === i ? c.color : undefined }} onClick={() => seek(c.start + 0.01)}><span className="mono" style={{ color: c.color }}>{i + 1}</span> {c.short} <span className="mono" style={{ color: 'var(--faint)' }}>{fmtTime(c.start)}</span></button>)}
              </div>
            </div>
          </div>
          <LabPanel params={params} set={setParams} ph={ph} spec={spec} onReset={() => setParams(DEFAULTS)} />
          <p style={{ color: 'var(--faint)', fontSize: 12 }}>Keys: <span className="kbd">Space</span> play/pause · <span className="kbd">←</span><span className="kbd">→</span> 5 s · <span className="kbd">N</span>/<span className="kbd">P</span> chapter · <span className="kbd">C</span> captions · <span className="kbd">G</span> concept tags. Physics is simplified for teaching: Kanaya–Okayama range, Kramers continuum, Z⁴ fluorescence-yield model, Gaussian detector response.</p>
        </div>
        <div className="lg:sticky" style={{ top: 'calc(env(safe-area-inset-top, 0px) + 12px)' }}>
          <ScriptPanel loc={loc} t={t} onJump={nt => { seek(nt); setInfo(null); }} follow={follow} setFollow={setFollow} />
        </div>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body></html>
