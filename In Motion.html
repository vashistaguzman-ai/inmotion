/* ---------- EELS ---------- */
const EELS_SOURCES = [

  B: { name: 'Boron', edge: 'B K', e0: 188, ep: 23 },
  C: { name: 'Carbon (amorphous)', edge: 'C K', e0: 284, ep: 25 },
  N: { name: 'Nitrogen (in BN)', edge: 'N K', e0: 401, ep: 25 },
  O: { name: 'Oxygen (in an oxide)', edge: 'O K', e0: 532, ep: 23 },
  Al: { name: 'Aluminium', edge: 'Al L₂,₃', e0: 73, ep: 15.0 },
  Si: { name: 'Silicon', edge: 'Si L₂,₃', e0: 99, ep: 16.7 },
  Ti: { name: 'Titanium', edge: 'Ti L₂,₃', e0: 456, ep: 17.5, wl: 5.7 },

function eelsDerived(pr) {

/* ---------- Concepts (overlay cards) ---------- */
function conceptCard(mode, id, d) {

      core: { title: 'Core level · ' + L.l, kind: 'Bound electron', body: 'An inner-shell electron held tightly by the nucleus. Its binding energy, measured from the Fermi level, identifies the element and shifts slightly with chemical state.', formula: 'BE(' + L.l + ') = ' + fmt(L.be) + ' eV' },

/* ---------- Narration ---------- */
const DEFAULT_SCRIPTS = {
  xps: [
    { title: 'X-ray photons arrive', lines: [

const WPS = 2.6;

function parseScript(text, fallback) {

  if (!lines.length) return { error: 'The script is empty. Paste or upload narration text first.' };

  lines.forEach(l => {
    const m = l.match(/^(?:#{1,3}\s*|chapter\s*\d+\s*[:.\-–]\s*|stage\s*\d+\s*[:.\-–]\s*)(.+)$/i);
    if (m) { cur = { title: m[1].trim(), body: [] }; heads.push(cur); return; }
